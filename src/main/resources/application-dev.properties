spring.application.name=apigateway-service

server.port = 8058

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

logging.level.com.netflix.eureka=off
logging.level.com.netflix.discovery=off

# Actuator
management.endpoints.web.exposure.include= *

# Log Trace INFO
logging.pattern.level = '%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]'

# Zipkin server endpoint (defaults to http://localhost:9411/api/v2/spans)
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

# Sampling probability (0.1 = 10% default; 1.0 = 100% for local testing)
management.tracing.sampling.probability=1.0

# Spring Cloud API Gateway
management.endpoint.health.show-details = always
management.endpoint.gateway.access = unrestricted

spring.cloud.gateway.server.webflux.discovery.locator.enabled = true

# Customization Spring Cloud API Gateway

spring.cloud.gateway.server.webflux.routes[0].id= USER-MS

spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE

spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/lokesh/user-service/**

spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/lokesh/user-service/(?<remaining>.*), /${remaining}